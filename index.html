<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Overtime Tracker</title>
<style>
  :root { --bg:#0f1115; --card:#1a1d24; --border:#2a2f3a; --fg:#e8eaed; --muted:#9aa0a6; --accent:#f5c542; --green:#34c759; --red:#ff453a; --blue:#5ac8fa; }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--fg);min-height:100vh;padding:24px}
  h1{font-size:22px;margin-bottom:4px}
  .sub{color:var(--muted);font-size:13px;margin-bottom:20px}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:20px}
  .card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px}
  .label{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.6px}
  .val{font-size:26px;font-weight:700;margin-top:6px}
  .status{display:inline-block;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:600}
  .on{background:rgba(52,199,89,.15);color:var(--green)}
  .off{background:rgba(255,69,58,.15);color:var(--red)}
  .btns{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:24px}
  button{padding:14px 22px;border:none;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer;transition:transform .05s}
  button:active{transform:scale(.97)}
  .start{background:var(--green);color:#000}
  .end{background:var(--red);color:#fff}
  .export{background:var(--blue);color:#000}
  .reset{background:var(--border);color:var(--fg)}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th,td{padding:10px 8px;text-align:left;border-bottom:1px solid var(--border)}
  th{color:var(--muted);font-size:12px;text-transform:uppercase}
  .right{text-align:right}
  .empty{color:var(--muted);text-align:center;padding:20px}
  canvas{width:100%;height:220px;background:var(--bg);border-radius:8px}
  @media(max-width:600px){.val{font-size:22px}}
</style>
</head>
<body>
  <h1>Overtime Tracker</h1>
  <div class="sub">Counts hours worked past 5:30 PM. Data saved in browser. GPS tags location per session.</div>

  <div class="grid">
    <div class="card"><div class="label">Status</div><div class="val" id="status">Off</div></div>
    <div class="card"><div class="label">Today's Overtime</div><div class="val" id="today">0.00 h</div></div>
    <div class="card"><div class="label">Total Owed</div><div class="val" id="total">0.00 h</div></div>
    <div class="card"><div class="label">Sessions</div><div class="val" id="count">0</div></div>
  </div>

  <div class="btns">
    <button class="start" onclick="start()">Start Overtime</button>
    <button class="end" onclick="end()">Work Ended</button>
    <button class="export" onclick="exportData()">Export CSV</button>
    <button class="reset" onclick="resetAll()">Reset All</button>
  </div>

  <div class="card" style="margin-bottom:20px">
    <div class="label" style="margin-bottom:10px">Daily Overtime (hours)</div>
    <canvas id="chart"></canvas>
  </div>

  <div class="card">
    <div class="label" style="margin-bottom:10px">History</div>
    <table id="table">
      <thead><tr><th>Date</th><th>Start</th><th>End</th><th class="right">Hours</th><th>Location</th></tr></thead>
      <tbody></tbody>
    </table>
    <div class="empty" id="empty">No sessions yet.</div>
  </div>

<script>
const KEY='ot_sessions', RUNKEY='ot_running';
let running = JSON.parse(localStorage.getItem(RUNKEY)||'null');
let sessions = JSON.parse(localStorage.getItem(KEY)||'[]');
let currentLoc = null;

function save(){localStorage.setItem(KEY,JSON.stringify(sessions));localStorage.setItem(RUNKEY,JSON.stringify(running));}
function fmt(t){return new Date(t).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});}
function fmtDate(t){return new Date(t).toLocaleDateString();}
function hours(a,b){return (b-a)/3600000;}
function todayOvertime(){
  const today=new Date().toDateString(); let h=0;
  sessions.filter(s=>new Date(s.start).toDateString()===today).forEach(s=>{if(s.end)h+=hours(s.start,s.end);});
  if(running && new Date(running).toDateString()===today) h+=hours(running,Date.now());
  return h;
}
function totalOwed(){
  let h=0; sessions.forEach(s=>{if(s.end)h+=hours(s.start,s.end);});
  if(running)h+=hours(running,Date.now()); return h;
}
function captureLoc(cb){
  if(!navigator.geolocation){cb(null);return;}
  navigator.geolocation.getCurrentPosition(p=>cb({lat:p.coords.latitude,lon:p.coords.longitude,acc:p.coords.accuracy}),()=>cb(null),{timeout:8000});
}
function locStr(l){return l?(l.lat.toFixed(4)+', '+l.lon.toFixed(4)):'—';}

function drawChart(){
  const c=document.getElementById('chart'); const ctx=c.getContext('2d');
  const dpr=window.devicePixelRatio||1;
  const w=c.clientWidth||600, h=220;
  c.width=w*dpr; c.height=h*dpr; ctx.scale(dpr,dpr);
  ctx.clearRect(0,0,w,h);
  const days=[];
  for(let i=6;i>=0;i--){const d=new Date(); d.setDate(d.getDate()-i); days.push(d.toDateString());}
  const vals=days.map(ds=>{
    let h=0;
    sessions.forEach(s=>{if(s.end && new Date(s.start).toDateString()===ds) h+=hours(s.start,s.end);});
    if(running && new Date(running).toDateString()===ds) h+=hours(running,Date.now());
    return h;
  });
  const max=Math.max(0.5,...vals);
  const bw=(w-40)/days.length;
  days.forEach((ds,i)=>{
    const x=20+i*bw; const bh=(vals[i]/max)*(h-40);
    ctx.fillStyle='#5ac8fa'; ctx.fillRect(x,h-20-bh,bw-6,bh);
    ctx.fillStyle='#9aa0a6'; ctx.font='10px system-ui';
    const lbl=new Date(ds).toLocaleDateString([],{month:'short',day:'numeric'});
    ctx.fillText(lbl,x,h-6);
    ctx.fillStyle='#e8eaed'; ctx.fillText(vals[i].toFixed(1),x,h-24-bh);
  });
}

function render(){
  document.getElementById('status').innerHTML = running?'<span class="status on">Running</span>':'<span class="status off">Stopped</span>';
  document.getElementById('today').textContent = todayOvertime().toFixed(2)+' h';
  document.getElementById('total').textContent = totalOwed().toFixed(2)+' h';
  document.getElementById('count').textContent = sessions.length + (running?1:0);
  const tb=document.querySelector('#table tbody'); tb.innerHTML='';
  const rows=[...sessions]; if(running) rows.push({start:running,end:null,loc:currentLoc});
  rows.sort((a,b)=>b.start-a.start);
  rows.forEach(s=>{
    const tr=document.createElement('tr');
    const hrs = s.end?hours(s.start,s.end):hours(s.start,Date.now());
    tr.innerHTML=`<td>${fmtDate(s.start)}</td><td>${fmt(s.start)}</td><td>${s.end?fmt(s.end):'—'}</td><td class="right">${hrs.toFixed(2)}</td><td>${locStr(s.loc)}</td>`;
    tb.appendChild(tr);
  });
  document.getElementById('empty').style.display = rows.length?'none':'block';
  drawChart();
}

function start(){
  if(running){alert('Already running.');return;}
  captureLoc(l=>{currentLoc=l; running=Date.now(); save(); render();});
}
function end(){
  if(!running){alert('Not running.');return;}
  sessions.push({start:running,end:Date.now(),loc:currentLoc});
  running=null; currentLoc=null; save(); render();
}
function resetAll(){
  if(!confirm('Clear all sessions?'))return;
  sessions=[];running=null;currentLoc=null;save();render();
}
function exportData(){
  const rows=[['date','start','end','hours','lat','lon']];
  sessions.forEach(s=>rows.push([new Date(s.start).toISOString(), new Date(s.start).toISOString(), s.end?new Date(s.end).toISOString():'', s.end?hours(s.start,s.end).toFixed(2):'', s.loc?s.loc.lat:'', s.loc?s.loc.lon:'']));
  if(running) rows.push([new Date(running).toISOString(),new Date(running).toISOString(),'','running',currentLoc?currentLoc.lat:'',currentLoc?currentLoc.lon:'']);
  const csv=rows.map(r=>r.map(x=>`"${x}"`).join(',')).join('\n');
  const blob=new Blob([csv],{type:'text/csv'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='overtime_export.csv'; a.click();
}

setInterval(render,1000);
render();
window.addEventListener('resize',drawChart);
</script>
</body>
</html>
